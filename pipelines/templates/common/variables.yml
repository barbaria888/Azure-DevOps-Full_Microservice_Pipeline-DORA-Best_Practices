# templates/common/variables.yml
variables:
  - name: dotnetVersion
    value: '8.0.x'
  - name: buildConfiguration
    value: 'Release'
  - name: dockerRegistryServiceConnection
    value: 'DockerHub Registry Connection'           # <-- replace with your ACR service connection name
  - name: containerRegistry
    value: 'docker.io'                          # <-- Standard Docker Hub registry URL
  - name: dockerHubUsername
    value: 'hardik0811'                        # <-- Your Docker Hub username (needed for repository paths)
  
  
  
  # ===== AKS Settings =====
  - name: aksServiceConnection
    value: 'AKS-Connection'           # <-- replace
  - name: aksNamespace
    value: 'application'                 # <-- replace or make parameter
  - name: imageTag
    value: '$(Build.BuildId)'
    # ADD THESE TWO
  - name: aksResourceGroup
    value: 'your-aks-resource-group'            # e.g. 'rg-aks-dev'
  - name: aksClusterName
    value: 'your-aks-cluster-name'              # e.g. 'aks-dev'