# templates/common/variables.yml
variables:
  - name: dotnetVersion
    value: '8.0.x'
  - name: buildConfiguration
    value: 'Release'
  - name: dockerRegistryServiceConnection
    value: 'DockerHub Registry Connection'           # Docker Hub service connection name
  - name: containerRegistry
    value: 'docker.io'                          # <-- Standard Docker Hub registry URL
  - name: dockerHubUsername
    value: 'hardik0811'                        # <-- Your Docker Hub username (needed for repository paths)
  - name: imageTag
    value: '$(Build.BuildId)'
  
  
  
  # ===== AKS Settings =====
  - name: aksServiceConnection
    value: 'Azure-Resource-Svc-Connection-For-AKS'           # <-- replace
  - name: aksNamespace
    value: 'default'                 # <-- replace or make parameter
    # ADD THESE TWO
  - name: aksResourceGroup
    value: 'k8sgpt'            # e.g. 'rg-aks-dev'
  - name: aksClusterName
    value: 'ASP-MicroserviceApplication'              # e.g. 'aks-dev'