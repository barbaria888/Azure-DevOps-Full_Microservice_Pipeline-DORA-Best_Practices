# templates/common/variables.yml
variables:
  - name: dotnetVersion
    value: '8.0.x'
  - name: buildConfiguration
    value: 'Release'
  - name: dockerRegistryServiceConnection
    value: 'Azure Container Registry'           # <-- replace with your ACR service connection name
  - name: containerRegistry
    value: 'hardikarora.azurecr.io'       # <-- replace
  - name: aksServiceConnection
    value: 'AKS-Connection'           # <-- replace
  - name: aksNamespace
    value: 'application'                 # <-- replace or make parameter
  - name: imageTag
    value: '$(Build.BuildId)'
    # ADD THESE TWO
  - name: aksResourceGroup
    value: 'your-aks-resource-group'            # e.g. 'rg-aks-dev'
  - name: aksClusterName
    value: 'your-aks-cluster-name'              # e.g. 'aks-dev'