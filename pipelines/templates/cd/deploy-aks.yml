parameters:
  - name: imageRepository
    type: string
  - name: deploymentName
    type: string
  - name: containerName
    type: string
  - name: namespace
    type: string
    default: 'application'

steps:
  - task: KubernetesManifest@1
    displayName: 'Deploy ${{ parameters.deploymentName }}'
    inputs:
      action: 'deploy'
      connectionType: 'azureResourceManager'
      azureSubscriptionConnection: $(aksServiceConnection)
      azureResourceGroup: $(aksResourceGroup)
      kubernetesCluster: $(aksClusterName)
      useClusterAdmin: true
      namespace: ${{ parameters.namespace }}
      manifests: |
        k8s/${{ parameters.deploymentName }}.yaml
      containers: |
        $(dockerHubUsername)/${{ parameters.imageRepository }}:$(imageTag)