# templates/cd/deploy-aks.yml
parameters:
  - name: imageRepository
    type: string
  - name: deploymentName
    type: string
  - name: containerName
    type: string
  - name: namespace
    type: string
    default: 'application'

steps:
  - task: KubernetesManifest@1
    displayName: 'Deploy to AKS'
    inputs:
      action: 'deploy'
      connectionType: 'azureResourceManager'
      azureSubscriptionConnection: $(aksServiceConnection)
      azureResourceGroup: '$(aksResourceGroup)'
      kubernetesCluster: '$(aksClusterName)'
      namespace: ${{ parameters.namespace }}
      manifests: |
        k8s/${{ parameters.deploymentName }}.yaml
      containers: |
        $(containerRegistry)/${{ parameters.imageRepository }}:$(imageTag)