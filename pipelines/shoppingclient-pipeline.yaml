trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - Shopping/Shopping.Client/**
      - pipelines/**

pr:
  branches:
    include:
      - main
      - develop

variables:
  - template: templates/common/variables.yml

  - name: imageRepository
    value: 'shoppingclient'

  - name: projectPath
    value: 'Shopping/Shopping.Client/Shopping.Client.csproj'

  - name: dockerfilePath
    value: 'Shopping/Shopping.Client/Dockerfile'

stages:
  - stage: CI
    displayName: 'Build, Test & Scan'

    jobs:
      - job: BuildAndScan
        displayName: 'Build, Test & Security Scan'

        pool:
          vmImage: 'ubuntu-latest'

        steps:
          # FIX 1: Pass the prefixed name here so the image is built with the Docker Hub prefix locally
          - template: templates/ci/build-dotnet.yml
            parameters:
              projectPath: $(projectPath)
              dockerfilePath: $(dockerfilePath)
              imageRepository: '$(dockerHubUsername)/$(imageRepository)' 
              runTests: false

          # CORRECT: Trivy now scans the locally built image name
          - template: templates/security/trivy-scan.yml
            parameters:
              imageRepository: '$(dockerHubUsername)/$(imageRepository)'
              failOnSeverity: 'HIGH,CRITICAL'

          # CORRECT: The push command pushes the locally built image matching this exact name
          - task: Docker@2
            displayName: 'Push image to Docker Hub'
            inputs:
              containerRegistry: $(dockerRegistryServiceConnection) 
              repository: '$(dockerHubUsername)/$(imageRepository)'  
              command: 'push'
              tags: |
                $(imageTag)
                latest

  - stage: CD
    displayName: 'Deploy to AKS'
    dependsOn: CI
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: Deploy
        displayName: 'Deploy Shopping Client'
        environment: 'dev'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                # 1. Deploy shared infrastructure first
                - template: templates/cd/deploy-infra.yml
                  parameters:
                    namespace: $(aksNamespace)

                # 2. Deploy the actual service
                - template: templates/cd/deploy-aks.yml
                  parameters:
                    imageRepository: $(imageRepository)
                    deploymentName: 'shoppingclient'
                    containerName: 'shoppingclient'
                    namespace: $(aksNamespace)