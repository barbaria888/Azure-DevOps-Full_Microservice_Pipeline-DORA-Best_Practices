trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - Shopping/Shopping.Client/**
      - pipelines/**

pr:
  branches:
    include:
      - main
      - develop

variables:
  - template: templates/common/variables.yml

  - name: imageRepository
    value: 'shoppingclient'

  - name: projectPath
    value: 'Shopping/Shopping.Client/Shopping.Client.csproj'

  - name: dockerfilePath
    value: 'Shopping/Shopping.Client/Dockerfile'

stages:

  - stage: CI
    displayName: 'Build, Test & Scan'

    jobs:

      - job: BuildAndScan
        displayName: 'Build, Test & Security Scan'

        pool:
          vmImage: 'ubuntu-latest'

        steps:

          - template: templates/ci/build-dotnet.yml
            parameters:
              projectPath: $(projectPath)
              dockerfilePath: $(dockerfilePath)
              imageRepository: $(imageRepository)
              runTests: false

          - template: templates/security/trivy-scan.yml
            parameters:
              imageRepository: $(imageRepository)
              failOnSeverity: 'HIGH,CRITICAL'

          - task: Docker@2
            displayName: 'Push Shopping Client image to ACR'
            inputs:
              containerRegistry: 'Azure Container Registry'
              repository: $(imageRepository)
              command: 'push'
              tags: |
                $(imageTag)
                latest