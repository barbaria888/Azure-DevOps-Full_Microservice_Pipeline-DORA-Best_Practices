trigger:
  branches:
    include:
      - main
      - develop

  paths:
    include:
      - Shopping/Shopping.API/**
      - pipelines/**


pr:
  branches:
    include:
      - main
      - develop


variables:
  - template: templates/common/variables.yml

  - name: imageRepository
    value: 'shoppingapi'

  - name: projectPath
    value: 'Shopping/Shopping.API/Shopping.API.csproj'

  - name: dockerfilePath
    value: 'Shopping/Shopping.API/Dockerfile'


stages:

  - stage: CI
    displayName: 'Build, Test & Scan'

    jobs:

      - job: BuildAndScan
        displayName: 'Build, Test & Security Scan'

        pool:
          vmImage: 'ubuntu-latest'

        steps:

          - template: templates/ci/build-dotnet.yml
            parameters:
              projectPath: 'Shopping/Shopping.API/Shopping.API.csproj'
              dockerfilePath: 'Shopping/Shopping.API/Dockerfile'
              imageRepository: 'shoppingapi'
              runTests: false

          - template: templates/security/trivy-scan.yml
            parameters:
              imageRepository: 'shoppingapi'
              failOnSeverity: 'HIGH,CRITICAL'

          - task: Docker@2
            displayName: 'Push image to ACR'
            inputs:
              containerRegistry: 'Azure Container Registry'
              repository: 'shoppingapi'
              command: 'push'
              tags: |
                $(imageTag)
                latest