# shoppingapi-pipeline.yaml
trigger:
  branches:
    include:
      - main
      - develop
      - Deployment
  paths:
    include:
      - Shopping/Shopping.API/**
      - pipelines/**

pr:
  branches:
    include:
      - main
      - develop
      - Deployment

variables:
  - template: templates/common/variables.yml
  - name: imageRepository
    value: 'shoppingapi'
  - name: projectPath
    value: 'Shopping/Shopping.API/Shopping.API.csproj'
  - name: dockerfilePath
    value: 'Shopping/Shopping.API/Dockerfile'

stages:
  - stage: CI
    displayName: 'Build, Test & Scan'
    jobs:
      - job: BuildAndScan
        displayName: 'Build, Test & Security Scan'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - template: templates/ci/build-dotnet.yml
            parameters:
              projectPath: $(projectPath)
              dockerfilePath: $(dockerfilePath)
              imageRepository: '$(dockerHubUsername)/$(imageRepository)'
              runTests: false

          - template: templates/security/trivy-scan.yml
            parameters:
              imageRepository: '$(dockerHubUsername)/$(imageRepository)'
              failOnSeverity: 'HIGH,CRITICAL'

          - task: Docker@2
            displayName: 'Push image to Docker Hub'
            inputs:
              containerRegistry: $(dockerRegistryServiceConnection)
              repository: '$(dockerHubUsername)/$(imageRepository)'
              command: 'push'
              tags: |
                $(imageTag)
                latest

  - stage: CD
    displayName: 'Deploy to AKS'
    dependsOn: CI
    condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/Deployment'))
    jobs:
      - deployment: Deploy
        displayName: 'Deploy Shopping API'
        environment: 'dev'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - template: templates/cd/deploy-infra.yml
                  parameters:
                    namespace: $(aksNamespace)

                - template: templates/cd/deploy-aks.yml
                  parameters:
                    imageRepository: $(imageRepository)
                    deploymentName: 'shoppingapi'
                    containerName: 'shoppingapi'
                    namespace: $(aksNamespace)