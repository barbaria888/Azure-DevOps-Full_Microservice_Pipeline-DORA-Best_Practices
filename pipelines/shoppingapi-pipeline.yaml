# Deploy to Azure Kubernetes Service
# Build and push image to Azure Container Registry; Deploy to Azure Kubernetes Service
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

# shoppingapi-pipeline.yaml
trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - src/Services/Shopping.API/**
      - pipelines/**

pr:
  branches:
    include:
      - main
      - develop

variables:
  - template: templates/common/variables.yml
  - name: imageRepository
    value: 'shoppingapi'
  - name: projectPath
    value: 'src/Services/Shopping.API/Shopping.API.csproj'   # adjust
  - name: dockerfilePath
    value: 'src/Services/Shopping.API/Dockerfile'             # adjust

stages:
  - stage: CI
    displayName: 'Build, Test & Scan'
    jobs:
      - job: BuildAndScan
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - template: templates/ci/build-dotnet.yml
            parameters:
              projectPath: $(projectPath)
              dockerfilePath: $(dockerfilePath)
              imageRepository: $(imageRepository)
              runTests: true

          - template: templates/security/trivy-scan.yml
            parameters:
              imageRepository: $(imageRepository)
              failOnSeverity: 'HIGH,CRITICAL'

          - task: Docker@2
            displayName: 'Push image to ACR'
            inputs:
              containerRegistry: $(dockerRegistryServiceConnection)
              repository: $(imageRepository)
              command: 'push'
              tags: |
                $(imageTag)
                latest

  - stage: CD
    displayName: 'Deploy to AKS'
    dependsOn: CI
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: Deploy
        environment: 'dev'                    # create this environment in Azure DevOps
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/cd/deploy-aks.yml
                  parameters:
                    imageRepository: $(imageRepository)
                    deploymentName: 'shoppingapi'
                    containerName: 'shoppingapi'
                    namespace: $(aksNamespace)